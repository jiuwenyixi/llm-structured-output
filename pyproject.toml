[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-output-helper"
version = "0.2.0"
description = "Framework-free LLM structured output utility — three-layer fallback for JSON extraction"
readme = "README.md"
license = {text = "MIT AND Apache-2.0"}
requires-python = ">=3.8"
authors = [
    {name = "HaiFeng Gu", email = "1091635234@qq.com"},
]
keywords = ["llm", "json", "structured-output", "ai", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "json5>=0.9.0",
]

[project.optional-dependencies]
pydantic = [
    "pydantic>=2,<3",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/jiuwenyixi/llm-structured-output"
Repository = "https://github.com/jiuwenyixi/llm-structured-output"

[tool.setuptools]
package-dir = {"" = "."}
license-files = ["LICENSE", "LICENSE-APACHE-2.0", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_output_helper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
