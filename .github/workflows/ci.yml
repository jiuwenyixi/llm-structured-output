name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[dev]" build twine
      - run: python -m pytest -q
      - name: Test optional Pydantic integration
        run: |
          python -m pip install ".[pydantic]"
          python -m pytest -q
      - name: Test declared minimum Pydantic version
        if: matrix.python-version == '3.10'
        run: |
          python -m pip install 'pydantic==2.0'
          python -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Smoke test the installed wheel outside the source tree
        run: |
          python -m venv /tmp/llm-output-smoke
          /tmp/llm-output-smoke/bin/python -m pip install dist/*.whl
          /tmp/llm-output-smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('pydantic') is None"
          for wheel_path in dist/*.whl; do
            /tmp/llm-output-smoke/bin/python -m pip install "${wheel_path}[pydantic]"
          done
          cp examples/basic.py examples/pydantic_validation.py /tmp/
          cd /tmp
          /tmp/llm-output-smoke/bin/python basic.py
          /tmp/llm-output-smoke/bin/python pydantic_validation.py
          /tmp/llm-output-smoke/bin/python -c 'from llm_output_helper import structured_output; assert structured_output("{\"name\":\"ok\"}", ensure_keys=["name"]) == {"name": "ok"}'
