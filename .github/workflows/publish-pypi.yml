name: Publish v0.2.0 to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  verify-distributions:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download the verified GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir dist
          gh release download v0.2.0 --pattern 'llm_output_helper-0.2.0*' --dir dist
          cd dist
          sha256sum --check <<'CHECKSUMS'
          8db4fd33931538a15e0c9f30827cc8f77bc37bc77a600ef5ed0c847a7b2a66db  llm_output_helper-0.2.0-py3-none-any.whl
          d2deb0893adbe5be7c0eb7def1f34fc7058831701714abcfdb30040e847e8e26  llm_output_helper-0.2.0.tar.gz
          CHECKSUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2
      - name: Validate distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: verify-distributions
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/llm-output-helper/0.2.0/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
